<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ការបញ្ជាទិញរបស់ខ្ញុំ - Dam Ey</title>

  <!-- Google Fonts: Plus Jakarta Sans & Siemreap / Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Siemreap&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/my-orders.css" />

  <!-- Auth Guard: Ensures user is authenticated & routes sellers directly to dashboard -->
  <script>
    (function() {
      const isLoggedIn = localStorage.getItem('cropwise_logged_in') === 'true';
      const userRole = localStorage.getItem('cropwise_user_role');
      if (!isLoggedIn) {
        window.location.replace('login.html');
      } else if (userRole === 'seller') {
        window.location.replace('seller-dashboard.html');
      }
    })();
  </script>
</head>

<body>
  <div class="device-wrapper">
    <div class="mobile-frame">

      <!-- Header Section -->
      <header class="orders-header">
        <div class="orders-nav-row">
          <button class="orders-back-btn" id="ordersBackBtn" onclick="goBack()" title="ត្រឡប់ក្រោយ">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="orders-header-title-box">
            <h1 class="orders-main-title">ការបញ្ជាទិញរបស់ខ្ញុំ</h1>
            <span class="orders-sub-title">តាមដានស្ថានភាពទំនិញដែលបានកុម្ម៉ង់</span>
          </div>
          <button class="orders-action-btn" id="refreshOrdersBtn" title="ផ្ទុកឡើងវិញ" onclick="location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>

        <!-- Status Filter Tabs -->
        <div class="orders-tabs-wrapper">
          <button class="order-tab-chip active" data-status="pending" onclick="switchOrderTab('pending')">
            <span>កំពុងរង់ចាំ</span>
            <span class="tab-badge-count">2</span>
          </button>
          <button class="order-tab-chip" data-status="shipping" onclick="switchOrderTab('shipping')">
            <span>កំពុងដឹក</span>
            <span class="tab-badge-count">1</span>
          </button>
          <button class="order-tab-chip" data-status="completed" onclick="switchOrderTab('completed')">
            <span>បានទទួល</span>
            <span class="tab-badge-count">3</span>
          </button>
          <button class="order-tab-chip" data-status="all" onclick="switchOrderTab('all')">
            <span>ទាំងអស់</span>
          </button>
        </div>
      </header>

      <!-- Main Content / Orders List -->
      <main class="orders-main-content">
        <!-- Notification Alert Banner -->
        <div class="orders-alert-banner">
          <div class="alert-icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <div class="alert-text-box">
            <p class="alert-msg">អ្នកផ្គត់ផ្គង់នឹងទាក់ទងមកអ្នកតាមទូរស័ព្ទដើម្បីបញ្ជាក់ទីតាំង និងម៉ោងដឹកជញ្ជូន។</p>
          </div>
        </div>

        <!-- Container for Orders List -->
        <div class="orders-cards-container" id="ordersCardsContainer">
          <!-- Populated by my-orders.js -->
        </div>
      </main>

      <!-- Bottom Floating Help Contact Bar -->
      <div class="orders-bottom-bar">
        <div class="orders-help-info">
          <span class="help-title">ត្រូវការជំនួយពីការកុម្ម៉ង់?</span>
          <span class="help-phone">ទាក់ទងផ្នែកបម្រើអតិថិជន: 012 345 678</span>
        </div>
        <a href="tel:012345678" class="orders-call-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <span>ទូរស័ព្ទ</span>
        </a>
      </div>

    </div>
  </div>

  <script src="js/my-orders.js"></script>
</body>

</html>
