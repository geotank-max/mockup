<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ការបញ្ជាទិញ - Dam Ey</title>

  <!-- Google Fonts: Plus Jakarta Sans & Siemreap / Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Siemreap&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/my-orders.css" />
</head>

<body>
  <div class="device-wrapper">
    <div class="mobile-frame">

      <!-- Top Header: Search Bar & Message Icon -->
      <header class="orders-top-header">
        <div class="orders-search-box">
          <svg class="orders-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="orders-search-input" id="ordersSearchInput" placeholder="ស្វែងរក" oninput="filterOrders(this.value)" />
        </div>
        <button class="orders-msg-btn" id="ordersMsgBtn" onclick="openToast('មិនទាន់មានសារថ្មីទេ')" title="សារ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <circle cx="9" cy="10" r="1" fill="currentColor"></circle>
            <circle cx="12" cy="10" r="1" fill="currentColor"></circle>
            <circle cx="15" cy="10" r="1" fill="currentColor"></circle>
          </svg>
          <span class="orders-msg-badge-dot"></span>
        </button>
      </header>

      <!-- Scrollable Orders List Container -->
      <main class="orders-scroll-content" id="ordersScrollContent">
        <!-- Rendered dynamically by js/my-orders.js -->
      </main>

      <!-- Bottom Navigation Bar (4 tabs: Home, Products, Orders, Profile) -->
      <!-- Bottom Navigation Bar (5 tabs: Home, Products, Run [Center], Orders [Active], Profile) -->
      <nav class="bottom-nav">
        <!-- 1. Home Tab -->
        <a href="index.html" class="nav-tab" id="tabHome">
          <div class="nav-icon-container">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="nav-label">ទំព័រដើម</span>
        </a>

        <!-- 2. Products Tab -->
        <a href="products.html" class="nav-tab" id="tabProducts">
          <div class="nav-icon-container">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
          </div>
          <span class="nav-label">ផលិតផល</span>
        </a>

        <!-- 3. Run Tab (Center Standout Action Center) -->
        <a href="run-test.html" class="nav-tab run-tab" id="tabRun">
          <div class="nav-icon-container run-btn-pill" title="រត់តេស្តដី & ដំណាំ">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </div>
          <span class="nav-label">រត់តេស្ត</span>
        </a>

        <!-- 4. Orders Tab (Active) -->
        <a href="my-orders.html" class="nav-tab active" id="tabOrders">
          <div class="nav-icon-container">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <span class="nav-label">ការកុម្ម៉ង់</span>
        </a>

        <!-- 5. Profile Tab -->
        <a href="farmer-profile.html" class="nav-tab" id="tabProfile">
          <div class="nav-icon-container">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span class="nav-label">គណនី</span>
        </a>
      </nav>

      <!-- Toast Popup -->
      <div class="toast-popup" id="toastPopup">
        <span class="toast-icon">✓</span>
        <span class="toast-msg" id="toastMsg">Action completed</span>
      </div>

    </div>
  </div>

  <script src="js/my-orders.js"></script>
</body>

</html>
