<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ចុះឈ្មោះគណនីថ្មី - Dam Ey</title>

  <!-- Google Fonts: Plus Jakarta Sans & Siemreap / Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Siemreap&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body>
  <div class="device-wrapper">
    <div class="mobile-frame auth-wrapper">

      <!-- Header Navigation Bar -->
      <div class="auth-header-bar">
        <button class="auth-back-btn" onclick="goBack()" title="ត្រឡប់ក្រោយ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="auth-header-title">បង្កើតគណនីកសិករ Dam Ey</span>
        <div style="width: 38px;"></div>
      </div>

      <div class="auth-container">

        <!-- Farmer Banner Section -->
        <div class="auth-brand-section" style="margin-bottom: 4px;">
          <div class="auth-logo-pill" style="width: 72px; height: 72px; padding: 4px; border-radius: 22px;">
            <img src="assets/images/logo.png" alt="Dam Ey Logo" style="width: 60px; height: 60px; object-fit: contain;" />
          </div>
          <h1 class="auth-title">ចុះឈ្មោះគណនីកសិករ</h1>
          <p class="auth-subtitle">បង្កើតគណនីដើម្បីទទួលបានការណែនាំ និងទិញធាតុចូលកសិកម្ម</p>
        </div>

        <!-- Alert Notification Box -->
        <div class="auth-alert-msg" id="authAlert"></div>

        <!-- Form Card -->
        <form class="auth-form-card" onsubmit="handleFarmerRegister(event)">
          <div class="input-field-group">
            <label class="input-label" for="regName">ឈ្មោះកសិករ (ឈ្មោះពេញ)</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <input type="text" id="regName" class="auth-input" placeholder="ឧទាហរណ៍៖ សុខា កសិករ..." required />
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="regPhone">លេខទូរស័ព្ទ</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
              </div>
              <input type="tel" id="regPhone" class="auth-input" placeholder="012 345 678..." required />
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="regProvince">ខេត្ត / ក្រុង</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </div>
              <select id="regProvince" class="auth-input">
                <option value="កណ្តាល">ខេត្តកណ្តាល</option>
                <option value="សៀមរាប">ខេត្តសៀមរាប</option>
                <option value="កំពង់ចាម">ខេត្តកំពង់ចាម</option>
                <option value="បាត់ដំបង">ខេត្តបាត់ដំបង</option>
                <option value="ពោធិ៍សាត់">ខេត្តពោធិ៍សាត់</option>
                <option value="ស្វាយរៀង">ខេត្តស្វាយរៀង</option>
                <option value="តាកែវ">ខេត្តតាកែវ</option>
                <option value="ព្រៃវែង">ខេត្តព្រៃវែង</option>
              </select>
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="regCrop">ដំណាំចម្បង</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 20h10"></path>
                  <path d="M10 20c5.5-2.5.8-6.4 3-10"></path>
                </svg>
              </div>
              <select id="regCrop" class="auth-input">
                <option value="ស្រូវ">ស្រូវ (Rice)</option>
                <option value="បន្លែ">បន្លែគ្រប់មុខ (Vegetables)</option>
                <option value="ពោត">ពោត (Corn)</option>
                <option value="ស្វាយ">ស្វាយ / ដំណាំហូបផ្លែ (Mango/Fruits)</option>
                <option value="ដំឡូងមី">ដំឡូងមី (Cassava)</option>
              </select>
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="regPassword">ពាក្យសម្ងាត់</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input type="password" id="regPassword" class="auth-input" placeholder="យ៉ាងតិច ៤ តួអក្សរ..." required />
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="regConfirmPassword">បញ្ជាក់ពាក្យសម្ងាត់</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>
              <input type="password" id="regConfirmPassword" class="auth-input" placeholder="បញ្ចូលពាក្យសម្ងាត់ម្តងទៀត..." required />
            </div>
          </div>

          <button type="submit" class="auth-submit-btn">
            <span>ចុះឈ្មោះជាកសិករ</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </form>

        <!-- Footer Link -->
        <div class="auth-footer-prompt">
          <span>មានគណនីរួចហើយ? </span>
          <a href="login.html">ចូលប្រើប្រាស់នៅទីនេះ</a>
        </div>

      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
</body>

</html>
