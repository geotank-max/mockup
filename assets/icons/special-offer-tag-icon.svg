<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- Container Squircle with generous safe margins -->
  <rect x="8" y="8" width="80" height="80" rx="22" fill="#FFF3E0" stroke="#FFCC80" stroke-width="2"/>

  <!-- Promotional Offer Tag (properly scaled to fit cleanly within safe padding) -->
  <g transform="translate(14, 14) rotate(-12 34 34)">
    <!-- Tag String Loop -->
    <path d="M12 28c-5-5-9-13-3-18s13 3 18 8" fill="none" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tag Body -->
    <path d="M16 20l20-20c1.5-1.5 4-1.5 5.5 0l17 17c1.5 1.5 1.5 4 0 5.5L38 43c-1.5 1.5-4 1.5-5.5 0L16 25.5C14.5 24 14.5 21.5 16 20z" fill="#FF7043" stroke="#D84315" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Tag Eyelet -->
    <circle cx="21" cy="22" r="3.2" fill="#FFFFFF" stroke="#BF360C" stroke-width="2"/>

    <!-- Agricultural Symbol: Radiant Sun & Furrow Fields -->
    <circle cx="41" cy="16" r="4.5" fill="#FFEB3B" stroke="#F57F17" stroke-width="1.6"/>
    <!-- Farm Furrows -->
    <path d="M35 29c2.5-1.2 5-1.2 7.5 0m-10 4c4-1.8 8-1.8 11.5 0m-10 4c2.5-1.2 5-1.2 7.5 0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Discount Sparkle -->
  <path d="M72 64l1.5 3.8l3.8 1.5l-3.8 1.5l-1.5 3.8l-1.5-3.8l-3.8-1.5l3.8-1.5z" fill="#FFB300"/>
</svg>
