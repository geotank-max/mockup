<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- Container Squircle with ample safe margins -->
  <rect x="8" y="8" width="80" height="80" rx="22" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2"/>

  <!-- Golden Sun behind cloud -->
  <circle cx="38" cy="36" r="11" fill="#FFD54F" stroke="#F57C00" stroke-width="2.5"/>
  <!-- Sun Rays -->
  <path d="M38 20v4M26.5 24.5l3 3M22 36h4M49.5 24.5l-3 3" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rain Cloud -->
  <path d="M32 58h26c5.5 0 10-4.5 10-10s-4.5-10-10-10c-.7 0-1.4.1-2 .3C63.5 32 57.5 27 50 27c-8.5 0-15.5 6.5-15.5 15 0 1.1.2 2.2.5 3.2C31.5 46.5 29 49.5 29 53c0 3.2 2.6 5 3 5z" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Rain Droplets -->
  <path d="M32 64l-2 4m8-4l-2 4m8-4l-2 4" stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Weather & Moisture Indicator Badge -->
  <circle cx="65" cy="62" r="13" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/>
  <path d="M65 54c-3.5 4.8-5 6.8-5 9a5 5 0 1 0 10 0c0-2.2-1.5-4.2-5-9z" fill="#29B6F6" stroke="#0277BD" stroke-width="1.8"/>
  <circle cx="65" cy="64" r="2" fill="#FFFFFF"/>
</svg>
