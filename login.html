<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ចូលប្រើប្រាស់គណនី - Dam Ey</title>

  <!-- Google Fonts: Plus Jakarta Sans & Siemreap / Kantumruy Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Siemreap&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body>
  <div class="device-wrapper">
    <div class="mobile-frame auth-wrapper">

      <div class="auth-container">
        <!-- Brand Section -->
        <div class="auth-brand-section">
          <div class="auth-logo-pill" style="width: 72px; height: 72px; padding: 4px; border-radius: 22px;">
            <img src="assets/images/logo.png" alt="Dam Ey Logo" style="width: 60px; height: 60px; object-fit: contain;" />
          </div>
          <h1 class="auth-title">ចូលប្រើប្រាស់ Dam Ey</h1>
          <p class="auth-subtitle">Right Fertilizer. Better Harvests.</p>
        </div>

        <!-- Role Selection Toggle -->
        <div class="role-toggle-container">
          <button class="role-toggle-btn active" data-role="farmer" onclick="selectRole('farmer')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21V10"></path>
              <path d="M12 11c-4.5 0-6.5-3.5-6.5-6.5 4 0 6.5 2.5 6.5 6.5z"></path>
              <path d="M12 11c4.5 0 6.5-3.5 6.5-6.5-4 0-6.5 2.5-6.5 6.5z"></path>
            </svg>
            <span>កសិករ (Farmer)</span>
          </button>
          <button class="role-toggle-btn" data-role="seller" onclick="selectRole('seller')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 1.6-4.8A1.5 1.5 0 0 1 6 3.2h12a1.5 1.5 0 0 1 1.4 1L21 9"></path>
              <path d="M3 9a2.5 2.5 0 0 0 4.5 1.5 2.5 2.5 0 0 0 4.5-1.5 2.5 2.5 0 0 0 4.5 1.5A2.5 2.5 0 0 0 21 9"></path>
              <path d="M4 11.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.5"></path>
              <path d="M9 21v-4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4"></path>
            </svg>
            <span>អ្នកផ្គត់ផ្គង់ (Seller)</span>
          </button>
        </div>

        <!-- Alert Notification Box -->
        <div class="auth-alert-msg" id="authAlert"></div>

        <!-- Form Card -->
        <form class="auth-form-card" onsubmit="handleLogin(event)">
          <div class="input-field-group">
            <label class="input-label" for="authUsername">ឈ្មោះអ្នកប្រើ ឬ លេខទូរស័ព្ទ</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <input type="text" id="authUsername" class="auth-input" placeholder="ឈ្មោះអ្នកប្រើ ឬ លេខទូរស័ព្ទកសិករ..." required />
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="authPassword">ពាក្យសម្ងាត់</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input type="password" id="authPassword" class="auth-input" placeholder="បញ្ចូលពាក្យសម្ងាត់..." required />
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('authPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-row-options">
            <label class="remember-me-label">
              <input type="checkbox" checked />
              <span>ចងចាំខ្ញុំ</span>
            </label>
            <a href="forgot-password.html" class="forgot-link">ភ្លេចពាក្យសម្ងាត់?</a>
          </div>

          <button type="submit" class="auth-submit-btn">
            <span>ចូលប្រើប្រាស់</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </form>

        <!-- Footer Link -->
        <div class="auth-footer-prompt">
          <span>មិនទាន់មានគណនី? </span>
          <a href="register.html">ចុះឈ្មោះគណនីកសិករ</a>
        </div>

      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
</body>

</html>
